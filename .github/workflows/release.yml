name: Release

# Membuat Docky_<versi>_universal.dmg (Apple Silicon + Intel) dan GitHub Release.
#
# Update otomatis: simpan isi kunci privat updater sebagai secret
# TAURI_SIGNING_PRIVATE_KEY (kata sandinya kosong). Dengan secret itu, rilis
# juga berisi Docky.app.tar.gz + tanda tangannya dan latest.json yang dibaca
# app terpasang. Tanpa secret, .dmg tetap dibuat tapi tanpa paket update.
#
# Rilis publik nanti: isi juga APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
# APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, dan APPLE_TEAM_ID lalu
# tambahkan ke `env` langkah build supaya app ditandatangani dan dinotarisasi.
# Sampai saat itu app ditandatangani ad-hoc (signingIdentity "-").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: cargo test -p docky-core

      - name: Versi tag harus sama dengan versi app
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$app_version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan versi app v$app_version" >&2
            exit 1
          fi

      - name: Pilih konfigurasi updater
        id: cfg
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "args=--target universal-apple-darwin" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret TAURI_SIGNING_PRIVATE_KEY belum ada; rilis ini tanpa paket update otomatis."
            echo "args=--target universal-apple-darwin --config src-tauri/tauri.no-updater.conf.json" >> "$GITHUB_OUTPUT"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v__VERSION__' }}
          releaseName: Docky v__VERSION__
          releaseBody: |
            Unduh Docky_*_universal.dmg, buka, lalu seret Docky ke Applications.
            Build ini belum dinotarisasi Apple: buka lewat System Settings › Privacy & Security › Open Anyway (lihat README).
          # Harus terbit (bukan draft/prerelease) supaya releases/latest/download/latest.json
          # bisa dibaca app yang sudah terpasang.
          releaseDraft: false
          prerelease: false
          args: ${{ steps.cfg.outputs.args }}

      - name: Simpan .dmg sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docky-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
