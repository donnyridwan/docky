name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Logika (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p docky-core
      - run: cargo clippy -p docky-core --all-targets -- -D warnings

  macos:
    name: App macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Bundle .dmg universal (Apple Silicon + Intel)
        # Tanpa paket update; .dmg untuk dicoba langsung, bukan rilis.
        run: npx tauri build --target universal-apple-darwin --bundles app,dmg --config src-tauri/tauri.no-updater.conf.json
      - name: Ukuran app
        run: du -sh target/universal-apple-darwin/release/bundle/macos/Docky.app target/universal-apple-darwin/release/bundle/dmg/*.dmg
      - name: Simpan .dmg sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Docky-dmg
          path: target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
