name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Logika (cargo test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p docky-core
      - run: cargo clippy -p docky-core --all-targets -- -D warnings

  macos:
    name: App macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - run: cargo clippy --workspace -- -D warnings
      - run: cargo test --workspace
      - name: Bundle .app (tanpa tanda tangan)
        run: npx tauri build --bundles app
      - name: Ukuran app
        run: du -sh target/release/bundle/macos/Docky.app
